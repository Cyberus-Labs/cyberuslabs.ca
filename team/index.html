<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Meet the founders behind Cyberus Labs: Derek Proud and Danny Bouchard.">
  <title>The Team | Cyberus Labs</title>
  <link rel="icon" href="../assets/logo/cyberuslabs_logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../coming-soon.css">
</head>
<body>
  <div class="coming-soon-shell">
    <header class="coming-soon-header" data-header>
      <nav class="global-nav" aria-label="Main navigation">
        <a class="coming-soon-brand" href="/" aria-label="Cyberus Labs home">
          <img src="../assets/logo/cyberuslabs_logo.svg" alt="" aria-hidden="true">
          <span>Cyberus Labs</span>
        </a>

        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" data-nav-toggle>
          <span class="sr-only">Toggle navigation</span>
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="global-nav-links" id="site-navigation" data-nav-links>
          <a href="/">Home</a>
          <a href="/team/" aria-current="page">The Team</a>
          <a class="header-contact" href="mailto:contact@cyberuslabs.ca">Contact</a>
        </div>
      </nav>
    </header>

    <main class="team-main">
      <section class="team-hero" aria-labelledby="team-title">
        <div>
          <p class="section-eyebrow">The Team</p>
          <h1 id="team-title">The people behind Cyberus Labs</h1>
        </div>
      </section>

      <section class="founder-section" aria-label="Cyberus Labs founders">
        <article class="founder-card">
          <div class="founder-photo" aria-label="Photo placeholder for Derek Proud">
            <span>DP</span>
          </div>
          <div class="founder-content">
            <p class="founder-role">CEO</p>
            <h2>Derek Proud</h2>
            <div class="founder-bio">
              <p>Derek is currently doing CEO things. We'll get a bio out of him eventually.</p>
            </div>
          </div>
        </article>

        <article class="founder-card">
          <div class="founder-photo" aria-label="Photo placeholder for Danny Bouchard">
            <span>DB</span>
          </div>
          <div class="founder-content">
            <p class="founder-role">CTO</p>
            <h2>Danny Bouchard</h2>
            <div class="founder-bio">
              <p>Danny's bio is currently in the backlog. Please don't ask what priority it has.</p>
            </div>
          </div>
        </article>
      </section>
    </main>

    <footer class="coming-soon-footer">
      <p>&copy; <span data-year></span> Cyberus Labs</p>
    </footer>
  </div>

  <script src="../script.js"></script>
</body>
</html>
